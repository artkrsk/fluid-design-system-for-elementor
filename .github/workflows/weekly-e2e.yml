name: Weekly E2E

# Chromium gates every PR. Firefox and WebKit run here instead: they're slower,
# and one engine-specific flake shouldn't be able to block a merge.

on:
  schedule:
    # Monday 04:00 UTC — after the canary, so the two don't contend for wp-env.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      zip_budget_mb: '1.0'
      # Unit tests and the PHP suites already run on every PR; this job exists
      # for the other two browser engines.
      run_js_tests: false
      run_e2e: true
      playwright_browsers: 'firefox webkit'
      e2e_command: pnpm exec playwright test --project=firefox --project=webkit
      wp_env_ports: '8888,8889'
