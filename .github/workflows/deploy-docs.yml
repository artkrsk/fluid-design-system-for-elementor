name: Deploy VitePress Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/deploy-docs.yml@main
    with:
      docs_base_path: /fluid-design-system-for-elementor/
