name: Deploy VitePress Documentation

on:
  push:
    branches: [main, feature/documentation]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/deploy-docs.yml@e6a2fdf517588bf09377a052a59709f152316244 # main
    with:
      docs_base_path: /fluid-design-system-for-elementor/
