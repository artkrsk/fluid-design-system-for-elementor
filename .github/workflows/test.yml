name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      zip_budget_mb: '1.0'
      coverage: true
      # deploy-docs only runs post-merge; this catches a broken docs config on the PR.
      build_docs: true
      wp_env_ports: '8888,8889'
      run_e2e: true
      # The Abilities API lands in WP 6.9 and this plugin supports 6.0+, so
      # plugin-check flags every wp_register_ability* call. Every one of them is
      # behind a runtime guard (the abilities hooks no-op when the API is
      # absent), and dropping 6.0 support to satisfy a static check would be the
      # wrong trade. Carried over from the hand-rolled workflow.
      extra_plugin_check_ignore_codes: wp_function_not_compatible_with_requires_wp
      # The integration tier runs PHPUnit 10.5 from an isolated Composer project
      # (tests/php/tools) because two autoloaders with the same generated class
      # name are fatal in one process — so it can't use the shared suite loop.
      integration_setup_command: |
        docker run --rm -v "$PWD:/w" alpine sh -c 'rm -rf /w/tests/php/tools/vendor' 2>/dev/null || true
        composer install --prefer-dist --no-progress --working-dir=tests/php/tools
      integration_command: |
        pnpm exec wp-env run tests-cli \
          --env-cwd=wp-content/plugins/fluid-design-system-for-elementor/tests/php \
          -- php tools/vendor/bin/phpunit -c phpunit-wp.xml.dist
        pnpm exec wp-env run tests-cli \
          --env-cwd=wp-content/plugins/fluid-design-system-for-elementor/tests/php \
          -- php tools/vendor/bin/phpunit -c phpunit-elementor.xml.dist
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
