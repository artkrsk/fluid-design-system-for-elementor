# .github/workflows/cut-release.yml in a plugin repo — thin caller of the reusable tagger.
#
# Two triggers:
#   - pull_request closed: when a release/x.y.z PR is merged, the merge commit is verified and tagged,
#     which starts release.yml (GitHub Release + wp.org SVN). Live as written.
#   - workflow_dispatch: tag an already-merged release PR on demand (recovery: the PR merged before
#     this workflow existed, or its event never arrived). Dry run by default; untick it to tag for real.
#
# The job filter is only a cheap pre-check so ordinary PR merges do not start a job. The shared
# workflow re-validates everything (merged, same-repo head, release/x.y.z branch, default-branch base)
# and verifies the release commit before it tags. To make the automatic path report-only instead,
# change `dry_run` below to `true`.
name: Cut Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged release PR to tag (number)'
        required: true
        type: string
      dry_run:
        description: 'Verify and report only; create no tag'
        required: false
        type: boolean
        default: true

# One tag at a time, and never cancel one in flight.
concurrency:
  group: cut-release
  cancel-in-progress: false

# checks: read lets the shared workflow verify CI passed on the release PR's head commit before
# tagging — the backstop for a merge that bypassed the required-status-checks ruleset.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  cut:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/cut-release.yml@main
    with:
      client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      pr_number: ${{ inputs.pr_number }}
      # pull_request events have no inputs, so this is false (live) on merge and true (dry) by default on manual runs
      dry_run: ${{ inputs.dry_run == true }}
      # readme_path: 'src/wordpress-plugin/readme.txt'
      # shipped_paths: 'src/'
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
