name: WordPress Version Checker

# Files an issue when a new WordPress release means the "Tested up to" header
# needs a bump — the chore that otherwise gets discovered by users. The check
# lives in artkrsk/wordpress-plugin-workflows (wp-version-check.yml).

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      channel:
        description: Which WordPress versions count
        type: choice
        options: [rc, stable, beta]
        default: rc

permissions:
  contents: read

jobs:
  wordpress-version-checker:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/wp-version-check.yml@main
    # The check opens, updates and closes its own issue
    permissions:
      contents: read
      issues: write
    with:
      channel: ${{ inputs.channel || 'rc' }}
